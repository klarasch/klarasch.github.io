<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slaydy promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inter+Tight:wght@600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #08080a; overflow: hidden; }
  /* the frame keeps 16:9 and letterboxes inside whatever holds it */
  .fit { position: absolute; inset: 0; display: grid; place-items: center; }
  .frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; }
  .stage {
    position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
    transform-origin: 0 0; background: #08080a; overflow: hidden;
    font-family: "Inter", system-ui, sans-serif;
  }

  /* ---------- deck plane: 4 x 3 slides at full size, the camera moves it ---------- */
  .deckwrap { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 40%; }
  .plane { position: absolute; left: 0; top: 0; width: 5312px; height: 2288px; transform-origin: 0 0; }
  .slide {
    position: absolute; width: 1280px; height: 720px; overflow: hidden;
    background: var(--bg); border-radius: 6px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); outline-offset: 16px;
  }
  .s > * { position: absolute; }
  .b  { border-radius: 10px; background: var(--fg); }
  .m  { border-radius: 8px;  background: var(--muted); }
  .f  { border-radius: 8px;  background: var(--faint); }
  .a  { border-radius: 10px; background: var(--accent); }
  .a2 { border-radius: 10px; background: var(--accent-2); }
  .sf { border-radius: 18px; background: var(--surface); }
  .foot { left: 8%; bottom: 6.5%; width: 9%; height: 10px; border-radius: 5px; background: var(--muted); opacity: .7; }
  .pg   { right: 8%; bottom: 6.5%; width: 2.6%; height: 10px; border-radius: 5px; background: var(--muted); opacity: .7; }

  /* hero (edit-mode chrome rides inside it) */
  .hero-k { left: 8%; top: 29%; width: 64px; height: 6px; border-radius: 3px; background: var(--accent); }
  .title-grp { left: 8%; top: 34%; }
  .sel { position: absolute; inset: -14px -22px; border: 2px dashed var(--accent); border-radius: 10px; opacity: 0; }
  .ttl { position: relative; margin: 0; font: 600 62px/1.08 "Inter Tight", "Inter", system-ui, sans-serif; letter-spacing: -.028em; color: var(--fg); white-space: nowrap; }
  .ttl .ln { display: block; }
  .ttl .acc { color: var(--accent); }
  .ttl .w { border-radius: 6px; background: color-mix(in srgb, var(--accent) var(--sel, 0%), transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) var(--sel, 0%), transparent); }
  .caret { display: inline-block; width: 4px; height: .8em; margin: 0 -2px; vertical-align: -.04em; border-radius: 2px; background: var(--accent); opacity: 0; }
  .hero-sub { left: 8%; top: 63%; margin: 0; font: 400 24px/1.4 "Inter", system-ui, sans-serif; color: var(--muted); }
  .hero-foot { left: 8%; bottom: 6%; font: 500 15px/1 "Inter", system-ui, sans-serif; color: var(--muted); }
  .hero-pg { right: 8%; bottom: 6%; font: 500 14px/1 "JetBrains Mono", ui-monospace, monospace; color: var(--muted); }

  /* ---------- toolbar: copied from runtime.css ---------- */
  .barcam { position: absolute; left: 640px; top: 0; width: 0; height: 0; }
  .toolbar {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 2px; padding: 6px;
    background: rgba(16, 16, 20, .84); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, .1); border-radius: 14px;
    box-shadow: 0 16px 48px -8px rgba(0, 0, 0, .6); white-space: nowrap;
  }
  .tb-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
    border-radius: 9px; color: rgba(246, 245, 243, .84);
    font: 500 13px/1 "Inter", system-ui, sans-serif; transition: background .2s, color .2s;
  }
  .tb-btn.icon-only { width: 36px; padding: 0; justify-content: center; }
  .tb-btn.is-on { background: rgba(255, 255, 255, .1); color: #fff; }
  .tb-btn.primary { background: var(--tb-accent); color: var(--tb-accent-fg); }
  .tb-count { font: 500 13px/1 "JetBrains Mono", ui-monospace, monospace; min-width: 66px; justify-content: center; color: rgba(246, 245, 243, .7); }
  .tb-sep { width: 1px; height: 20px; background: rgba(255, 255, 255, .12); margin: 0 5px; }
  .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- cursor ---------- */
  .cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; pointer-events: none; }
  .cursor svg { position: absolute; left: -3px; top: -2px; width: 30px; height: 30px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); transform-origin: 3px 2px; }
  .cursor svg.beam { left: -15px; top: -15px; transform-origin: 15px 15px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3)); display: none; }
  .dimmer { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .ripple { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fff; opacity: 0; }
</style>
</head>
<body>
<div class="fit"><div class="frame" id="frame">
<div class="stage" id="stage">
  <div class="deckwrap" id="deckwrap"><div class="plane" id="plane"></div></div>
  <div class="dimmer" id="dimmer"></div>
  <div class="barcam" id="barcam">
    <div class="toolbar" id="bar-view"></div>
    <div class="toolbar" id="bar-edit"></div>
  </div>
  <div class="cursor" id="cursor">
    <div class="ripple" id="ripple"></div>
    <svg viewBox="0 0 24 24" id="beam" class="beam"><path d="M8.5 3.5c2 0 3.5.6 3.5 2v13c0 1.4-1.5 2-3.5 2M15.5 3.5c-2 0-3.5.6-3.5 2v13c0 1.4 1.5 2 3.5 2M9.5 12h5" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round"/><path d="M8.5 3.5c2 0 3.5.6 3.5 2v13c0 1.4-1.5 2-3.5 2M15.5 3.5c-2 0-3.5.6-3.5 2v13c0 1.4 1.5 2 3.5 2M9.5 12h5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" id="arrow"><path d="M3 2 L3 19.5 L7.6 15.4 L10.6 22 L13.6 20.7 L10.7 14.2 L17 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </div>
</div>
</div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-first" viewBox="0 0 24 24"><path d="M17 6l-6 6 6 6"/><path d="M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-present" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9.5 14.5L12 17l2.5-2.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13 7l3 3"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
  <symbol id="i-notes" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
</svg>

<script>
(() => {
  /* ======================= themes (themes/*.css) ======================= */
  const THEMES = [
    { app: "#08080a", bg: "#0b0b0f", fg: "#f6f5f3", muted: "rgba(246,245,243,.56)", faint: "rgba(246,245,243,.13)", surface: "#14141b", accent: "#ff5b2e", accent2: "#7c5cff", accentFg: "#0b0b0f" }, // midnight
    { app: "#e9e6df", bg: "#fbfaf7", fg: "#131318", muted: "rgba(19,19,24,.58)",    faint: "rgba(19,19,24,.14)",    surface: "#f2efe8", accent: "#d93a1f", accent2: "#3a2fd6", accentFg: "#fbfaf7" }, // paper
    { app: "#05100d", bg: "#071612", fg: "#eefaf4", muted: "rgba(238,250,244,.58)", faint: "rgba(238,250,244,.14)", surface: "#0d211b", accent: "#3ddc97", accent2: "#22d3ee", accentFg: "#04120e" }, // mint
  ];
  THEMES.push(THEMES[0]); // midnight again, so the loop closes
  const parse = (c) => {
    if (c[0] === "#") return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)).concat(1);
    return c.match(/[\d.]+/g).map(Number);
  };
  const KEYS = ["app", "bg", "fg", "muted", "faint", "surface", "accent", "accent2", "accentFg"];
  const P = THEMES.map(t => Object.fromEntries(KEYS.map(k => [k, parse(t[k])])));
  const mixTheme = (p) => {
    p = Math.max(0, Math.min(THEMES.length - 1, p));
    const i = Math.min(Math.floor(p), THEMES.length - 2), f = p - i, out = {};
    for (const k of KEYS) {
      const a = P[i][k], b = P[i + 1][k];
      const v = a.map((x, j) => x + (b[j] - x) * f);
      out[k] = `rgba(${v[0] | 0},${v[1] | 0},${v[2] | 0},${v[3].toFixed(3)})`;
    }
    return out;
  };
  const applyTheme = (el, th) => {
    el.style.setProperty("--bg", th.bg); el.style.setProperty("--fg", th.fg);
    el.style.setProperty("--muted", th.muted); el.style.setProperty("--faint", th.faint);
    el.style.setProperty("--surface", th.surface); el.style.setProperty("--accent", th.accent);
    el.style.setProperty("--accent-2", th.accent2);
  };

  /* ======================= slides ======================= */
  const r = (cls, x, y, w, h, extra = "") => `<div class="${cls}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;${extra}"></div>`;
  const chrome = `<div class="foot"></div><div class="pg"></div>`;
  const SLIDES = [
    // section
    r("a", 8, 30, 16, 26, "border-radius:16px") + r("b", 8, 62, 46, 8) + r("m", 8, 74, 28, 3) + chrome,
    // stats
    [0, 1, 2].map(i => r(i === 0 ? "a" : "b", 8 + i * 29, 34, 18, 16) + r("m", 8 + i * 29, 56, 22, 3) + r("f", 8 + i * 29, 62, 16, 3)).join("") + r("b", 8, 14, 30, 5) + chrome,
    // quote
    `<div style="left:7%;top:6%;font:900 340px/1 Georgia,serif;color:var(--accent)">&ldquo;</div>` + r("b", 8, 46, 70, 7) + r("b", 8, 57, 56, 7) + r("m", 8, 72, 18, 3) + chrome,
    // bento
    r("sf", 8, 12, 40, 76) + r("sf", 50, 12, 42, 36) + r("sf", 50, 52, 20, 36) + r("sf", 72, 52, 20, 36) +
      r("a", 12, 20, 14, 24, "border-radius:50%") + r("b", 12, 66, 28, 5) + r("m", 12, 75, 20, 3) + r("a2", 54, 20, 22, 4) + r("f", 54, 28, 32, 3) + r("a", 54, 62, 10, 14),
    // bars chart
    r("b", 8, 14, 32, 5) + [38, 54, 46, 70, 62, 84].map((h, i) => r(i === 5 ? "a" : "f", 10 + i * 13.5, 86 - h * .66, 9, h * .66, "border-radius:8px 8px 2px 2px")).join("") + r("m", 8, 86, 84, .5),
    // hero: split title
    r("sf", 54, 0, 46, 100, "border-radius:0") +
      `<div style="left:62%;top:12%;width:40%;height:71%;border-radius:50%;background:var(--accent)"></div>` +
      `<div style="left:56%;top:58%;width:20%;height:36%;border-radius:50%;border:16px solid var(--accent-2);box-sizing:border-box"></div>` +
      `<div class="hero-k"></div>` +
      `<div class="title-grp" id="tg"><div class="sel" id="sel"></div>` +
      `<h1 class="ttl"><span class="ln">Your <span id="w" class="w">next deck</span><span class="caret" id="caret"></span>,</span>` +
      `<span class="ln">made with <span class="acc">slaydy</span>.</span></h1></div>` +
      `<p class="hero-sub">Branded HTML decks that stay editable.</p>` +
      `<div class="hero-foot">slaydy</div><div class="hero-pg">06</div>`,
    // timeline
    r("b", 8, 14, 34, 5) + r("f", 8, 55, 84, .8) + [0, 1, 2, 3].map(i => r(i === 2 ? "a" : "b", 10 + i * 26, 52.3, 2.4, 4.3, "border-radius:50%") + r("m", 8 + i * 26, 62, 16, 3) + r("f", 8 + i * 26, 68, 11, 3)).join("") + chrome,
    // image
    r("sf", 0, 0, 100, 100, "border-radius:0") + `<div style="left:40%;top:-30%;width:70%;height:124%;border-radius:50%;background:var(--accent-2);opacity:.85"></div>` +
      `<div style="left:58%;top:30%;width:34%;height:60%;border-radius:50%;background:var(--accent)"></div>` + r("b", 8, 68, 34, 7) + r("m", 8, 80, 20, 3),
    // bullets
    r("b", 8, 14, 38, 6) + [0, 1, 2, 3].map(i => r("a", 8, 35.4 + i * 13, 1.6, 2.8, "border-radius:50%") + r(i % 2 ? "m" : "b", 12, 35 + i * 13, [52, 44, 58, 36][i], 3.6)).join("") + chrome,
    // compare
    r("sf", 8, 14, 40, 72) + r("sf", 52, 14, 40, 72, "box-shadow:inset 0 0 0 4px var(--accent)") + [0, 1].map(c => r(c ? "a" : "b", 12 + c * 44, 22, 18, 5) + [0, 1, 2].map(i => r("m", 12 + c * 44, 40 + i * 12, 28 - i * 4, 3)).join("")).join(""),
    // statement
    r("b", 8, 30, 72, 12) + r("b", 8, 47, 44, 12) + r("a", 54, 47, 30, 12) + chrome,
    // end
    r("a", 44, 22, 12, 21.3, "border-radius:50%") + r("b", 32, 54, 36, 7) + r("m", 40, 67, 20, 3),
  ];
  const plane = document.getElementById("plane");
  const COLS = 4, GAP = 64, HERO = 5;
  const slides = SLIDES.map((html, i) => {
    const el = document.createElement("div");
    el.className = "slide s";
    const c = i % COLS, rw = Math.floor(i / COLS);
    el.dataset.d = c + rw; // distance along the diagonal, drives the theme wave
    el.style.left = c * (1280 + GAP) + "px"; el.style.top = rw * (720 + GAP) + "px";
    el.innerHTML = html;
    plane.appendChild(el);
    return el;
  });
  const hero = slides[HERO];
  const HX = 1 * (1280 + GAP) + 640, HY = 1 * (720 + GAP) + 360;   // hero centre in plane px
  const GX = 5312 / 2, GY = 2288 / 2;                              // grid centre

  /* ======================= toolbars (runtime.js markup) ======================= */
  const ic = (n) => `<svg class="icon"><use href="#i-${n}"/></svg>`;
  const btn = (id, icon, label, cls = "") => `<div class="tb-btn ${label ? "" : "icon-only"} ${cls}" ${id ? `id="${id}"` : ""}>${ic(icon)}${label ? `<span>${label}</span>` : ""}</div>`;
  const nav = btn("", "first") + btn("", "prev") + `<div class="tb-btn tb-count" id="CNT">6 / 12</div>` + btn("", "next") + `<span class="tb-sep"></span>`;
  const barView = document.getElementById("bar-view"), barEdit = document.getElementById("bar-edit");
  barView.innerHTML = nav.replace("CNT", "btn-ov") + btn("btn-theme", "theme", "Theme") + btn("", "present", "Presenter") + btn("", "pdf", "Export") +
    btn("", "download", "Download copy") + `<span class="tb-sep"></span>` + btn("btn-edit", "edit", "Edit") + btn("", "help");
  barEdit.innerHTML = nav.replace("CNT", "cnt-e") + btn("", "plus", "Add slide") + btn("", "spark", "Request change") + btn("", "notes", "Notes") +
    `<span class="tb-sep"></span>` + btn("", "undo") + btn("", "download", "Download copy") + `<span class="tb-sep"></span>` + btn("", "check", "Done", "primary");

  /* ======================= timeline helpers ======================= */
  // everything sits on a 66 bpm grid: b(n) is the time of beat n
  const BEAT = 60 / 66, b = (n) => n * BEAT;
  const T = b(20);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const io = (x) => x < .5 ? 16 * x ** 5 : 1 - (-2 * x + 2) ** 5 / 2;      // camera: ease-in-out quint
  const io3 = (x) => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;      // small moves
  const out = (x) => 1 - (1 - x) ** 4;                                     // arrivals
  const lerp = (a, c, f) => a + (c - a) * f;
  // track([[beat, v], ...], ease) → value at time t
  const track = (keys, ease = io) => {
    keys = keys.map(([n, v]) => [b(n), v]);
    return (t) => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        if (t <= keys[i][0]) {
          const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
          return lerp(v0, v1, ease((t - t0) / (t1 - t0)));
        }
      }
      return keys[keys.length - 1][1];
    };
  };
  const pulse = (t, at, len = .3) => { const x = (t - at) / len; return x < 0 || x > 1 ? 0 : Math.sin(Math.PI * x); };

  /* ======================= the choreography (in beats) ======================= */
  //  0 slide builds      4 push back, toolbar rises    7 click overview
  // 10 theme, 11 theme  13 click Edit, dive in         15 select a word, 16 retype it
  // 18 click away       19 fade out                    20 loop
  const CLICK = { ov: b(7), th1: b(10), th2: b(11), edit: b(13), word: b(15), away: b(18) };

  // deck camera: plane point (cx, cy) at frame centre, scale, tilt, lift, blur, dim
  const cam = {
    s:    track([[0, 1], [4, 1], [5.5, .55], [7, .55], [8.5, .196], [13.5, .196], [15, 1]]),
    cx:   track([[0, HX], [7, HX], [8.5, GX], [13.5, GX], [15, HX]]),
    cy:   track([[0, HY], [7, HY], [8.5, GY], [13.5, GY], [15, HY]]),
    rx:   track([[0, 0], [4, 0], [5.5, 14], [7, 14], [8.5, 9], [13.5, 9], [15, 0]]),
    ty:   track([[0, 0], [4, 0], [5.5, -96], [7, -96], [8.5, -112], [13.5, -112], [15, 0]]),
    blur: track([[0, 0], [4, 0], [5.5, 5], [7, 5], [8.25, 0]]),
    dim:  track([[0, 0], [4, 0], [5.5, .38], [7, .38], [8.25, .08], [13.5, .08], [15, 0]]),
  };
  const siblings = track([[0, 0], [7.25, 0], [8.5, 1], [13.5, 1], [14.75, 0]], io3);
  const ring = track([[0, 0], [8, 0], [8.5, 1], [13, 1], [13.5, 0]], io3);

  // theme: p per slide; a diagonal wave on each Theme click (inside one beat), a quiet return at the end
  const STEP = BEAT / 10, WLEN = BEAT / 2;
  const themeAt = (t, d) =>
    out(clamp((t - (CLICK.th1 + .05 + d * STEP)) / WLEN)) +
    out(clamp((t - (CLICK.th2 + .05 + d * STEP)) / WLEN)) +
    io3(clamp((t - b(19)) / BEAT));

  // hero content lands on beats 0, 1, 2 and leaves on beat 19
  const build = (n) => track([[0, 0], [n, 0], [n + .8, 1], [19, 1], [19.8, 0]], out);
  const BL = { panel: build(0), sun: build(.25), ring2: build(.5), kick: build(1), t1: build(1), t2: build(1.25), sub: build(2), foot: build(2) };

  // toolbar camera: scale, which point of the bar sits at frame centre-x, y, opacity
  const bs = track([[0, 1.3], [5.5, 1.3], [6.75, 2.3], [13.5, 2.4], [14.75, 1]]);
  const by = track([[0, 840], [4.5, 840], [5.5, 610], [6.75, 596], [13.5, 596], [14.75, 674], [19, 674], [19.8, 820]]);
  const bo = track([[0, 0], [4.5, 0], [5.25, 1], [19, 1], [19.7, 0]], io3);
  const editMix = track([[0, 0], [14, 0], [14.75, 1]], io3);
  let FX = {};                  // bar-local x of each focus target, measured after layout
  const fxKeys = [[0, "c"], [5.5, "c"], [6.75, "btn-ov"], [9, "btn-ov"], [9.75, "btn-theme"], [12, "btn-theme"], [12.75, "btn-edit"], [13.5, "btn-edit"], [14.75, "c"]];
  const fx = (t) => track(fxKeys.map(([k, v]) => [k, FX[v]]))(t);

  // cursor: segments [from beat, to beat, from, to] between live-resolved targets
  const C = [
    [6, 6.8, { x: 980, y: 760 }, { el: "btn-ov", dx: 10, dy: 8 }],
    [9, 9.8, null, { el: "btn-theme", dx: 4, dy: 8 }],
    [12, 12.8, null, { el: "btn-edit", dx: 2, dy: 8 }],
    [13.75, 14.85, null, { el: "w", left: true, dx: 118, dy: 4 }],
    [15.3, 15.9, null, { el: "w", left: true, dx: 400, dy: 10 }],   // step aside so the typing stays clear
    [17.25, 17.9, null, { x: 880, y: 600 }],
    [19, 19.8, null, { x: 1180, y: 820 }],
  ].map(([a, z, f, to]) => [b(a), b(z), f, to]);
  const csz = track([[0, 2.2], [13.5, 2.2], [14.75, 1.3]]);   // the cursor sits at the camera's distance
  const co = track([[0, 0], [6, 0], [6.5, 1], [19.2, 1], [19.8, 0]], io3);
  const pressT = [CLICK.ov, CLICK.th1, CLICK.th2, CLICK.edit, CLICK.word - .16, CLICK.word, CLICK.away];

  // the rewrite: double-click selects "next deck" on 15, typing replaces it across beat 16
  const OLD = "next deck", NEW = "best talk";
  const wordAt = (t) => t < b(16) ? OLD : NEW.slice(0, Math.min(NEW.length, 1 + Math.floor((t - b(16)) / (BEAT / NEW.length))));
  const selPct = track([[0, 0], [15, 0], [15.15, 34], [16, 34], [16.01, 0]], io3);
  const boxO = track([[0, 0], [14.85, 0], [15, 1], [18, 1], [18.3, 0]], io3);
  const caretOn = (t) => t >= b(16) && t < b(18) && (t < b(17) || Math.floor((t - b(17)) / (BEAT / 2)) % 2 === 0);
  const ibeam = (t) => t > b(14.4) && t < b(17.6);

  /* ======================= render ======================= */
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), frame = $("frame"), deckwrap = $("deckwrap"), barcam = $("barcam"), dimmer = $("dimmer");
  const cursor = $("cursor"), arrow = $("arrow"), beam = $("beam"), ripple = $("ripple"), word = $("w");
  const q = (sel) => hero.querySelector(sel), qa = (sel) => [...hero.querySelectorAll(sel)];
  const heroParts = [
    [hero.children[0], BL.panel, "x"], [hero.children[1], BL.sun, "s"], [hero.children[2], BL.ring2, "s"],
    [q(".hero-k"), BL.kick, "x"], [qa(".ln")[0], BL.t1, "y"], [qa(".ln")[1], BL.t2, "y"],
    [q(".hero-sub"), BL.sub, "y"], ...qa(".hero-foot,.hero-pg").map(e => [e, BL.foot, "o"]),
  ];
  let K = 1;
  const fit = () => { K = frame.clientWidth / 1280; stage.style.transform = `scale(${K})`; };
  const measure = () => {
    const w = barView.offsetWidth;
    FX = { c: 0 };
    for (const id of ["btn-ov", "btn-theme", "btn-edit"]) { const el = $(id); FX[id] = el.offsetLeft + el.offsetWidth / 2 - w / 2; }
  };
  const resolve = (spec) => {
    if (!spec.el) return spec;
    const rc = $(spec.el).getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const x = spec.left ? rc.left : rc.left + rc.width / 2;
    return { x: (x - sr.left) / K + (spec.dx || 0), y: (rc.top + rc.height / 2 - sr.top) / K + (spec.dy || 0) };
  };
  const set = (el, prop, v) => { if (el.style[prop] !== v) el.style[prop] = v; };

  function render(t) {
    // deck camera; the blur filter only exists while the deck is out of focus
    plane.style.transform = `translate(640px, ${360 + cam.ty(t)}px) rotateX(${cam.rx(t)}deg) scale(${cam.s(t)}) translate(${-cam.cx(t)}px, ${-cam.cy(t)}px)`;
    const bl = cam.blur(t);
    set(deckwrap, "filter", bl > .02 ? `blur(${bl.toFixed(2)}px)` : "none");
    set(dimmer, "opacity", cam.dim(t).toFixed(3));

    // themes, slide by slide (colour only: no per-slide transforms while the wave runs)
    const sib = siblings(t);
    slides.forEach((el, i) => {
      applyTheme(el, mixTheme(themeAt(t, +el.dataset.d)));
      if (i === HERO) return;
      set(el, "opacity", sib.toFixed(3));
      set(el, "transform", `scale(${lerp(.9, 1, sib).toFixed(4)})`);
    });
    const gTh = mixTheme(themeAt(t, 2.5));
    stage.style.background = gTh.app;
    document.body.style.background = gTh.app;
    // overview marks the current slide with an accent outline (outside the slide's clip)
    set(hero, "outline", `12px solid color-mix(in srgb, var(--accent) ${(ring(t) * 100).toFixed(1)}%, transparent)`);

    // hero build
    for (const [el, f, mode] of heroParts) {
      const v = f(t);
      set(el, "opacity", v.toFixed(3));
      set(el, "transform", mode === "x" ? `translateX(${((1 - v) * -40).toFixed(2)}px)` : mode === "y" ? `translateY(${((1 - v) * 28).toFixed(2)}px)` : mode === "s" ? `scale(${lerp(.82, 1, v).toFixed(4)})` : "none");
    }

    // the rewrite
    const wt = wordAt(t);
    if (word.textContent !== wt) word.textContent = wt;
    word.style.setProperty("--sel", selPct(t).toFixed(1) + "%");
    set($("sel"), "opacity", boxO(t).toFixed(3));
    set($("caret"), "opacity", caretOn(t) ? "1" : "0");

    // toolbar
    const bscale = bs(t);
    barcam.style.transform = `translate(${-fx(t) * bscale}px, ${by(t)}px) scale(${bscale})`;
    barcam.style.opacity = bo(t);
    const em = editMix(t);
    barView.style.opacity = 1 - em; barEdit.style.opacity = em;
    barView.style.transform = `translate(-50%,-50%) scale(${1 - em * .04})`;
    barEdit.style.transform = `translate(-50%,-50%) scale(${.96 + em * .04})`;
    barcam.style.setProperty("--tb-accent", gTh.accent);
    barcam.style.setProperty("--tb-accent-fg", gTh.accentFg);
    $("btn-ov").classList.toggle("is-on", t > CLICK.ov && t < b(13.5));
    $("btn-theme").classList.toggle("is-on", (t > CLICK.th1 && t < CLICK.th1 + BEAT / 2) || (t > CLICK.th2 && t < CLICK.th2 + BEAT / 2));
    $("btn-edit").classList.toggle("primary", t > CLICK.edit);
    for (const id of ["btn-ov", "btn-theme", "btn-edit"]) {
      const ats = id === "btn-ov" ? [CLICK.ov] : id === "btn-theme" ? [CLICK.th1, CLICK.th2] : [CLICK.edit];
      const pr = Math.max(...ats.map(at => pulse(t, at - .04, .26)));
      set($(id), "transform", `scale(${(1 - .07 * pr).toFixed(4)})`);
    }

    // cursor
    let seg = null;
    for (const c of C) { if (t >= c[0]) seg = c; }
    let pos;
    if (seg) {
      const i = C.indexOf(seg);
      const from = seg[2] || C[i - 1][3];
      const f = io3(clamp((t - seg[0]) / (seg[1] - seg[0])));
      const p0 = resolve(from), p1 = resolve(seg[3]);
      pos = { x: lerp(p0.x, p1.x, f), y: lerp(p0.y, p1.y, f) };
    } else pos = resolve(C[0][2]);
    cursor.style.transform = `translate(${pos.x.toFixed(2)}px, ${pos.y.toFixed(2)}px)`;
    cursor.style.opacity = co(t);
    let press = 0, rip = -1;
    for (const at of pressT) { press = Math.max(press, pulse(t, at - .06, .22)); if (t >= at && t < at + .6) rip = (t - at) / .6; }
    const ib = ibeam(t), sz = (1 - .14 * press) * csz(t);
    set(arrow, "display", ib ? "none" : "block"); set(beam, "display", ib ? "block" : "none");
    (ib ? beam : arrow).style.transform = `scale(${sz.toFixed(4)})`;
    ripple.style.opacity = rip < 0 ? 0 : (.55 * (1 - rip)).toFixed(3);
    ripple.style.transform = `scale(${rip < 0 ? .3 : lerp(.3, 1.4, out(rip))})`;
  }

  /* ======================= clock ======================= */
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  let playing = true, last = performance.now(), t = 0, visible = true;
  const tick = (now) => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (playing && visible && !document.hidden && !still.matches) t = (t + dt) % T;
    render(still.matches ? b(10.8) : t);
    requestAnimationFrame(tick);
  };
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(frame);
  // ?t=7.9 freezes a frame (handy for a poster image)
  const fixed = parseFloat(new URLSearchParams(location.search).get("t"));
  if (!isNaN(fixed)) { t = fixed; playing = false; }
  window.promo = { seek: (x) => { t = x; playing = false; }, play: () => { playing = true; }, render };

  const start = () => { fit(); measure(); requestAnimationFrame(tick); };
  addEventListener("resize", fit);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>
</body>
</html>
